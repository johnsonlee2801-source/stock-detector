name: 每日加密货币波动率扫描

on:
  schedule:
    # 币安日线在 UTC 00:00 收盘，00:20 UTC = 北京时间 08:20 跑
    - cron: '20 0 * * *'
  # 允许在 GitHub 网页上手动触发
  workflow_dispatch:

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许写回 repo（更新 report.html）

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行扫描（只用标准库，无需安装依赖）
        run: |
          python vol_scan.py --top-volume 100 --file watchlist.txt \
            --html report.html --json vol_data.json --history vol_history.json --quiet

      - name: 提交并推送报告
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report.html vol_data.json vol_history.json
          # 只有文件有变化时才提交
          git diff --staged --quiet || \
            git commit -m "🫧 自动更新波动率报告 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          git push
